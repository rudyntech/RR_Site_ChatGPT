<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="RoadRatings helps riders discover, explore, and rate great riding roads.">
  <meta name="theme-color" content="#010101">
  <title>RoadRatings | Find Great Riding Roads</title>
  <link rel="icon" type="image/png" href="assets/RoadRatings-Logo.png">
  <link rel="stylesheet" href="styles Fully Available.css">
</head>
<body>
  <main class="landing" aria-label="RoadRatings navigation">
    <a class="quadrant quadrant--map" href="https://map.roadratings.com" aria-label="Map — The App">
      <span class="quadrant__content">
        <span class="quadrant__title">Map</span>
        <span class="quadrant__subtitle">The App</span>
      </span>
    </a>

    <a class="quadrant quadrant--data" href="https://data.roadratings.com" aria-label="Data — The Spreadsheet">
      <span class="quadrant__content">
        <span class="quadrant__title">Data</span>
        <span class="quadrant__subtitle">The Spreadsheet</span>
      </span>
    </a>

    <a class="quadrant quadrant--pitch" href="https://pitch.roadratings.com" aria-label="Pitch — The Plea">
      <span class="quadrant__content">
        <span class="quadrant__title">Pitch</span>
        <span class="quadrant__subtitle">The Plea</span>
      </span>
    </a>

    <a class="quadrant quadrant--about" href="https://about.roadratings.com" aria-label="About — The Story">
      <span class="quadrant__content">
        <span class="quadrant__title">About</span>
        <span class="quadrant__subtitle">The Story</span>
      </span>
    </a>

    <a class="center-logo" href="https://home.roadratings.com" aria-label="RoadRatings home">
      <img src="assets/RoadRatings-Logo.png" alt="RoadRatings winding road diamond logo" width="790" height="792">
    </a>
  </main>
</body>
</html>
