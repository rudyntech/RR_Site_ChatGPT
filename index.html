<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="RoadRatings helps riders discover, explore, and rate great riding roads.">
  <meta name="theme-color" content="#010101">
  <title>RoadRatings | Find Great Riding Roads</title>
  <link rel="icon" type="image/png" href="assets/RoadRatings-Logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shared/navigation.css">
  <script src="shared/navigation.js" defer></script>
</head>
<body>
  <main class="landing" aria-label="RoadRatings navigation">
    <a class="quadrant quadrant--map is-unavailable" data-page="map" aria-disabled="true">
      <span class="quadrant__content">
        <span class="quadrant__title page-label">Map</span>
        <span class="quadrant__subtitle page-label">The App</span>
        <span class="quadrant__status availability-badge">Coming Soon</span>
      </span>
    </a>

    <a class="quadrant quadrant--data is-unavailable" data-page="data" aria-label="Data — The Spreadsheet">
      <span class="quadrant__content">
        <span class="quadrant__title page-label">Data</span>
        <span class="quadrant__subtitle page-label">The Spreadsheet</span>
        <span class="quadrant__status availability-badge">Coming Soon</span>
      </span>
    </a>

    <a class="quadrant quadrant--pitch is-unavailable" data-page="pitch" aria-disabled="true">
      <span class="quadrant__content">
        <span class="quadrant__title page-label">Pitch</span>
        <span class="quadrant__subtitle page-label">The Plea</span>
        <span class="quadrant__status availability-badge">Coming Soon</span>
      </span>
    </a>

    <a class="quadrant quadrant--about is-unavailable" data-page="about" aria-disabled="true">
      <span class="quadrant__content">
        <span class="quadrant__title page-label">About</span>
        <span class="quadrant__subtitle page-label">The Story</span>
        <span class="quadrant__status availability-badge">Coming Soon</span>
      </span>
    </a>

    <a class="center-logo brand-logo is-unavailable" data-page="home" aria-label="RoadRatings home">
      <img class="page-picture" src="assets/RoadRatings-Logo.png" alt="RoadRatings winding road diamond logo" width="790" height="792">
      <span class="availability-badge">Coming Soon</span>
    </a>
  </main>
</body>
</html>
