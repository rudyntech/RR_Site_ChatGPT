media:
  - name: about-pictures
    label: About pictures
    input: assets/about
    output: /assets/about
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: bike-pictures
    label: Bike pictures
    input: about/bikes
    output: /about/bikes
    extensions: [jpg, jpeg, png, webp]
    rename: safe

components:
  destination:
    type: object
    fields:
      - name: label
        label: Navigation label
        type: string
        required: true
      - name: url
        label: Destination address
        type: string
        required: true
        pattern:
          regex: '^https://[^\s]+$'
          message: Enter a full address beginning with https://
      - name: available
        label: Available on the live site
        type: boolean
        description: Turn off to show COMING SOON and disable links to this page. This does not take the destination offline.

content:
  - name: about
    label: About page
    type: file
    path: about/content.json
    format: json
    fields:
      - name: sections
        label: Page sections
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: id
            type: string
            hidden: true
          - name: title
            label: Section title
            type: string
            required: true
          - name: open
            type: boolean
            hidden: true
          - name: paragraphs
            label: Paragraphs
            type: rich-text
            description: Select text and use the toolbar for bold, italics, lists and other formatting. Add or reorder items as needed.
            options:
              format: html
              media: false
              switcher: false
            list:
              min: 1
          - name: images
            label: Pictures
            type: object
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: 'Picture {index}: {fields.alt}'
            fields:
              - name: src
                label: Picture
                type: image
                options:
                  media: about-pictures
                required: true
              - name: alt
                label: Picture description
                type: string
                required: true
                description: Briefly describe the picture for people using screen readers.
              - name: caption
                label: Caption
                type: text
                description: Shown below the picture. Leave blank for no caption.
              - name: source
                label: Photo credit or source link
                type: string
                description: For your records only. Put credits in the caption to display them publicly.
  - name: bikes
    label: Rudy's bikes
    type: file
    path: about/bikes.json
    format: json
    fields:
      - name: title
        label: Table heading
        type: text
        required: true
      - name: bikes
        label: Bikes in purchase order
        description: Enter bikes chronologically. The website displays them down the first column, then the second, then the third.
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{fields.name}'
        fields:
          - name: name
            label: Bike name
            type: string
            required: true
          - name: image
            label: Bike picture
            type: image
            options:
              media: bike-pictures
          - name: note
            label: Photo note
            type: text
          - name: credit
            label: Photographer credit
            type: string
          - name: source
            label: Source link
            type: string
          - name: license
            label: Photo license
            type: string
          - name: licenseUrl
            label: License link
            type: string
  - name: availability
    label: Page availability and links
    type: file
    path: availability.json
    format: json
    fields:
      - name: home
        label: Home
        type: object
        fields:
          - name: label
            label: Navigation label
            type: string
            required: true
          - name: url
            label: Destination address
            type: string
            required: true
            pattern: '^https://[^\s]+$'
          - name: available
            label: Available on the live site
            type: boolean
          - name: previewPath
            type: string
            hidden: true
      - name: map
        label: Map
        component: destination
      - name: data
        label: Data
        component: destination
      - name: pitch
        label: Pitch
        component: destination
      - name: about
        label: About
        type: object
        fields:
          - name: label
            label: Navigation label
            type: string
            required: true
          - name: url
            label: Destination address
            type: string
            required: true
            pattern: '^https://[^\s]+$'
          - name: available
            label: Available on the live site
            type: boolean
          - name: previewPath
            type: string
            hidden: true
          - name: previewAvailable
            type: boolean
            hidden: true
